<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Roll The Dice</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <div class="game">

        <h1>Try your Luck. Roll the Dice</h1>

        <p class="subtitle">Every roll is a new chance.</p>

        <div class="container">

            <div class="dice-wrapper">
                <img id="die-1" src="./images/dice-01.svg" alt="Dice 1">
                <img id="die-2" src="./images/dice-01.svg" alt="Dice 2">
            </div>

            <p id="total">You rolled 2</p>

            <button onclick="roll()">ROLL THE DICE</button>

        </div>

    </div>

    <script src="./script.js"></script>

</body>

</html>
